name: metrics

on:
  schedule:
    - cron: "0 6 * * *"   
  workflow_dispatch:        

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # commit fixado
        with:
          filename: metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: StheffannyNAlves
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
